name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.0, 26.12.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check:release

  container:
    name: Build and smoke test static image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file Dockerfile --tag maro-web:ci .
      - name: Start image and verify HTTP response
        run: |
          docker run --detach --name maro-web-ci --publish 127.0.0.1:8080:80 maro-web:ci
          curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/
      - name: Remove test container
        if: always()
        run: docker rm --force maro-web-ci || true
