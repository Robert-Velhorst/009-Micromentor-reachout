name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run check
      - run: npm run audit:security
      - run: npm test
      - run: node scripts/check-operational.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operational-check-linux
          path: artifacts/operational-check.json
          if-no-files-found: ignore
      - run: docker build -t maro:ci .

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operational-check-windows
          path: artifacts/operational-check.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: MARO-Windows11-Setup
          path: artifacts/MARO-Windows11-Setup.exe
